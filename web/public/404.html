<!doctype html>
<html lang="en" style="background:#050a18;color-scheme:dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lost in orbit · Khonsu</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 600px at 70% -10%, rgba(233,185,73,.10), transparent 60%), #050a18;
      color: #e6e3d8; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    .moon { width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 50%; background: #0b1633; box-shadow: inset -26px 0 0 0 #efe3c4, 0 0 40px rgba(233,185,73,.25); }
    h1 { margin: 0 0 8px; font-weight: 600; color: #fbe3a1; letter-spacing: .02em; }
    p { margin: 0 0 22px; color: #9aa3bd; }
    a { display: inline-block; padding: 10px 18px; border-radius: 11px; background: linear-gradient(180deg, #ffd48a, #e9b949); color: #1b1407; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true"></div>
    <h1>This page drifted out of orbit</h1>
    <p>The link may be old or mistyped. Everything on Khonsu starts from the home page.</p>
    <a id="home" href="/">Back to Khonsu</a>
  </main>
  <script>
    // GitHub Pages serves this for any unknown path; the site lives under /<repo>/.
    var base = "/" + (location.pathname.split("/")[1] || "") + "/";
    document.getElementById("home").href = base;
  </script>
</body>
</html>
