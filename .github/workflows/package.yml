name: Package

# Builds and tests the downloadable package (CLI binary + both SDKs + checksums + installer).
# Shared by the site workflow (every push) and the release workflow (every version tag),
# so a release is built exactly the way every commit already is.
on:
  workflow_call:
    inputs:
      ref:
        description: "The commit or tag to package (default: the one that triggered the caller)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    name: Downloadable package (Linux x86-64)
    # The oldest supported Ubuntu: the binary then runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain (GCC 13 for C++23; static libstdc++ and OpenSSL)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 libssl-dev binutils
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python -m pip install --quiet openai wheel setuptools
      - name: Versions agree (CLI, Python SDK, JavaScript SDK)
        run: scripts/check_version.sh
      - name: Build the downloads
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          scripts/package.sh dist/downloads "$site"
        env:
          CXX: g++-13
          PYTHON: python
      - name: Test the package (no source paths, checksum-verified install, integration suite)
        run: scripts/test_package.sh
        env:
          CXX: g++-13
          PYTHON: python
      - uses: actions/upload-artifact@v5
        with:
          name: downloads
          path: dist/downloads
