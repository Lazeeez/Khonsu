name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.preset }})
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 in Oct 2026
    strategy:
      fail-fast: false
      matrix:
        preset: [native, native-asan, native-tsan]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libssl-dev
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openai pytest
      - name: Build and run every suite (unit, model calls, workspace, diff/pytest, sync)
        run: scripts/test_native.sh ${{ matrix.preset }}
        env:
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs
      - if: matrix.preset == 'native'
        run: ./build/native/khonsu_bench --quick
      - if: matrix.preset == 'native'
        uses: actions/upload-artifact@v5
        with:
          name: khonsu-linux-x86_64
          path: build/native/khonsu

  web:
    name: WebAssembly build, tests & E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Emscripten SDK, WebAssembly build and kernel tests under Node
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset wasm
          cmake --build --preset wasm
          ctest --preset wasm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          KHONSU_BASE: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: E2E (Playwright, headless Chromium)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/${{ github.event.repository.name }}/ >/dev/null && break; sleep 1; done
          node e2e/smoke.mjs http://localhost:4173/${{ github.event.repository.name }}/ e2e-shots
        env:
          KHONSU_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e-shots
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, web]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
